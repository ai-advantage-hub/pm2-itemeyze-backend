version: 0.0
os: linux
files: 
  - source: /
    destination: /home/ubuntu/pm2-backend-prod
permissions:
  - object: /home/ubuntu/pm2-backend-prod
    owner: ubuntu
    group: ubuntu
hooks:
  BeforeInstall:
      - location: scripts/clean_instance.sh
        timeout: 300
        runas: ubuntu
  AfterInstall:
      - location: scripts/instance_os_dependencies.sh
        timeout: 300
        runas: ubuntu
      - location: scripts/python_dependencies.sh
        timeout: 300
        runas: ubuntu
      - location: scripts/copy_local_py.sh
        timeout: 300
        runas: ubuntu
      - location: scripts/nginx.sh
        timeout: 300
        runas: ubuntu
  ApplicationStart:
      - location: scripts/start_app.sh
        timeout: 300
        runas: ubuntu
  ApplicationUp:
      - location: scripts/pm2-backend-prod.sh
        timeout: 300
        runas: ubuntu
  
  